name: Cargo Audit

# Runs `cargo audit` on a schedule rather than on every PR.
#
# Previously this lived in the `test-backend` job as a
# `continue-on-error: true` step, so a vulnerable dep would not block
# a PR — it provided no per-push signal, just ~10-15s of install +
# scan time on every run. Pulling it into a daily workflow keeps the
# advisory database fresh in the Actions tab without the per-push tax.
#
# On a red audit run, a GitHub issue is filed (or the existing open
# audit issue is touched) so the failure surfaces somewhere a human
# actually looks. See the `notify-on-failure` job below.

on:
  schedule:
    # Daily at 09:00 UTC (16:00 ICT). Picks a quiet hour outside the
    # typical PR push window so cron contention is minimal.
    - cron: '0 9 * * *'
  # ALSO run whenever the Rust dependency graph changes. Cron-only left a
  # window of up to 24h in which a vulnerable crate could merge and
  # auto-deploy to production before the next scheduled audit noticed —
  # a real gap now that production deploys are unattended. Scoped to the
  # manifest/lockfile so this stays off the critical path for normal PRs.
  push:
    branches: [main]
    paths:
      - 'backend-rust/Cargo.lock'
      - 'backend-rust/Cargo.toml'
  pull_request:
    branches: [main]
    paths:
      - 'backend-rust/Cargo.lock'
      - 'backend-rust/Cargo.toml'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (toolchain set via with:)
        with:
          toolchain: '1.93'

      - name: Install cargo-audit
        uses: taiki-e/install-action@b3d3b86298745e7ee31467554af349ac2c5cec48 # cargo-audit tag
        with:
          tool: cargo-audit

      - name: Run cargo audit
        id: audit
        working-directory: ./backend-rust
        run: cargo audit

  # File a GitHub issue on audit failure so the red workflow doesn't just
  # sit unseen in the Actions tab. Reuses an open issue when one already
  # exists for the same workflow to avoid noise on multi-day-red windows.
  notify-on-failure:
    name: "Notify on audit failure"
    runs-on: ubuntu-latest
    needs: [audit]
    # Never on pull_request: a red audit on a PR branch is already visible as a
    # failed check on that PR, and filing "cargo audit failing on main" for a
    # branch that has not merged would be actively misleading.
    if: failure() && github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update audit-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="cargo audit failing on main"
          EXISTING=$(gh issue list -R "${{ github.repository }}" \
            --search "$TITLE in:title is:open" \
            --json number --jq '.[0].number // empty')

          BODY=$(cat <<EOF
          The scheduled \`Cargo Audit\` workflow failed.

          - Run: $RUN_URL
          - Commit: \`${{ github.sha }}\`
          - Triggered: \`${{ github.event_name }}\`

          Inspect the run log for the advisory ID and the affected dependency.
          A red audit on \`main\` is a security signal — do not close this issue
          until \`cargo audit\` is green again.
          EOF
          )

          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" -R "${{ github.repository }}" --body "$BODY"
            echo "Updated existing issue #$EXISTING"
          else
            # No --label: keep this dependency-free on label config. Label
            # the issue manually after triage so we don't depend on a label
            # that may not exist in the repo.
            gh issue create -R "${{ github.repository }}" \
              --title "$TITLE" \
              --body "$BODY"
            echo "Filed new audit-failure issue"
          fi
