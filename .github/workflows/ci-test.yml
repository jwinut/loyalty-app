name: CI Tests

on:
  push:
    branches: [main]
    # See ci-build-e2e.yml: skip workflow/docs-only pushes so a CI-config or
    # documentation change doesn't spin up the deploy-gating test pipeline.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.actor == 'dependabot[bot]' && 'dependabot-ci-test' || format('ci-test-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  NODE_VERSION: '24'

jobs:
  # =============================================================================
  # WORKSPACE PREPARATION (Node.js only)
  #
  # Backend (Rust) validation, lint, and build have moved to ci-build-e2e.yml so
  # that the single Rust toolchain pass produces the release binary directly,
  # sharing one target/ cache with build & deploy. See PR consolidating CI.
  # =============================================================================

  prepare:
    name: "Prepare Workspace"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend-cache-key: ${{ steps.cache-keys.outputs.frontend }}

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "frontend=frontend-deps-${{ hashFiles('frontend/package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Cache frontend dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: frontend/node_modules
          key: ${{ steps.cache-keys.outputs.frontend }}
          restore-keys: |
            frontend-deps-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

  # =============================================================================
  # FRONTEND VALIDATION & TESTING
  # =============================================================================

  lint-frontend:
    name: "Lint Frontend"
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore frontend dependencies
        id: deps-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: frontend/node_modules
          key: ${{ needs.prepare.outputs.frontend-cache-key }}

      # The Prepare Workspace cache save can be rejected by the Actions cache
      # service under load ("rate limit ... unable to reserve cache"), which
      # used to hard-fail this job via fail-on-cache-miss. Fall back to a
      # fresh install instead — slower, but never a spurious red.
      - name: Install frontend dependencies (cache-miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript check
        working-directory: ./frontend
        run: npm run typecheck

      - name: ESLint
        working-directory: ./frontend
        # Ratchet, same idiom as the design baseline: `eslint .` alone exits 0
        # on warnings, so every warn-level rule (including the security ones)
        # was decorative in the deploy-gating workflow. Pinning the current
        # count blocks NEW warnings without a big code churn.
        # Lower this number as warnings are fixed; never raise it.
        run: npm run lint -- --max-warnings 14

      # CLAUDE.md hard rule 4 ("never bypass, skip, or fake tests") is enforced
      # by scripts/validate-test-integrity.sh, which pre-push runs via
      # `quality:check` — but CI never ran it, so the rule had zero enforcement
      # on anything that reached main without a local push hook.
      - name: Test integrity guard
        run: npm run test:integrity

      # `npm audit` removed: it ran with continue-on-error: true, so it could
      # never fail anything — pure noise on the deploy-gating critical path.
      # Dependency CVEs are the job of Dependabot alerts (which open PRs and
      # page), with Trivy's filesystem scan as a second net. Four overlapping
      # CVE mechanisms on three cadences, only one of which surfaced anywhere,
      # was worse than three.

  test-frontend-unit:
    name: "Frontend Unit Tests"
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore frontend dependencies
        id: deps-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: frontend/node_modules
          key: ${{ needs.prepare.outputs.frontend-cache-key }}

      # The Prepare Workspace cache save can be rejected by the Actions cache
      # service under load ("rate limit ... unable to reserve cache"), which
      # used to hard-fail this job via fail-on-cache-miss. Fall back to a
      # fresh install instead — slower, but never a spurious red.
      - name: Install frontend dependencies (cache-miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test
        env:
          NODE_ENV: test
          CI: true
