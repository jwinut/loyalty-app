name: CI Tests

on:
  push:
    branches:
      - main
      # RELEASE-PLEASE BRANCHES GET THE REAL SUITE, PRE-MERGE.
      #
      # release-please opens its release PR using GITHUB_TOKEN, and GitHub does
      # not raise `pull_request` workflow runs for bot-token events
      # (anti-recursion). Result: PRs #350/#358/#362/#367/#372 all reached
      # `main` with ZERO check runs on their head commit — and merging a
      # release PR is precisely what triggers the UNATTENDED production
      # deploy. The one PR class that ships to prod was the one class nobody
      # verified first. (It is also the entire "26 of 30" shortfall behind
      # OpenSSF Scorecard alerts #92 SAST and #925 CI-Tests.)
      #
      # The fix is to run the GENUINE gate on the branch itself, so real
      # checks attach to the head commit before merge. Deliberately NOT a PAT,
      # a GitHub App token, or a token-only workflow whose sole product is a
      # green check — that would be metric-gaming, not verification.
      #
      # Glob, not the literal branch name: release-please builds the branch as
      # `release-please--branches--<target>--components--<component>`, and the
      # `<target>`/`<component>` halves move whenever
      # release-please-config.json changes (adding a package, renaming the
      # component, or targeting a maintenance branch). Only the
      # `release-please--` prefix is fixed by the action's branch-name builder,
      # so anchoring there is what survives a config edit. `**` also spans `/`,
      # covering a future `separator` change.
      - 'release-please--**'
    # See ci-build-e2e.yml: skip workflow/docs-only pushes so a CI-config or
    # documentation change doesn't spin up the deploy-gating test pipeline.
    # A release commit always touches .release-please-manifest.json and the
    # three version files, so it can never be skipped by this list.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

concurrency:
  # Keyed on the ref ONLY — never on the actor. The previous group collapsed to
  # the literal 'dependabot-ci-test' for every Dependabot run, so with
  # cancel-in-progress every newly-opened or rebased Dependabot PR evicted the
  # in-flight CI Tests run of every *other* open Dependabot PR. The victim was
  # left with a `cancelled` (not `success`) required check and needed a manual
  # UI re-run. Matches ci-build-e2e.yml's `ci-build-${{ github.ref }}` so both
  # workflows agree on which run is authoritative for a given PR.
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  NODE_VERSION: '24'

jobs:
  # =============================================================================
  # FRONTEND VALIDATION & TESTING (Node.js only)
  #
  # Backend (Rust) validation, lint, and build have moved to ci-build-e2e.yml so
  # that the single Rust toolchain pass produces the release binary directly,
  # sharing one target/ cache with build & deploy. See PR consolidating CI.
  #
  # There is deliberately NO "Prepare Workspace" job. Its only product was a
  # warmed frontend/node_modules cache, but both consumers already fall back to
  # a full `npm ci` on a cache miss (see the fallback steps below), so it bought
  # each of them a ~40s install at the price of a serial runner hop (~1-2 min)
  # sitting on the deploy critical path — ci-build-e2e.yml's
  # wait-for-frontend-checks blocks staging until this whole workflow finishes.
  # The two jobs now derive the identical cache key inline and start in parallel
  # at t=0; whichever finishes first saves the cache, and the loser's save is a
  # warning inside actions/cache, never a job failure.
  # =============================================================================

  lint-frontend:
    name: "Lint Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Same key in both frontend jobs, computed inline from the lockfile so
      # neither job has to wait on a producer job. No `restore-keys:` on
      # purpose — a partial-match tree is unconditionally deleted by the `npm
      # ci` below, so pulling one down is pure download time.
      - name: Restore frontend dependencies
        id: deps-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json') }}

      # The cache save can be rejected by the Actions cache service under load
      # ("rate limit ... unable to reserve cache"), which used to hard-fail this
      # job via fail-on-cache-miss. Fall back to a fresh install instead —
      # slower, but never a spurious red.
      - name: Install frontend dependencies (cache-miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript check
        working-directory: ./frontend
        run: npm run typecheck

      - name: ESLint
        working-directory: ./frontend
        # Ratchet, same idiom as the design baseline: `eslint .` alone exits 0
        # on warnings, so every warn-level rule (including the security ones)
        # was decorative in the deploy-gating workflow. Pinning the current
        # count blocks NEW warnings without a big code churn.
        # Lower this number as warnings are fixed; never raise it.
        run: npm run lint -- --max-warnings 14

      # CLAUDE.md hard rule 4 ("never bypass, skip, or fake tests") is enforced
      # by scripts/validate-test-integrity.sh, which pre-push runs via
      # `quality:check` — but CI never ran it, so the rule had zero enforcement
      # on anything that reached main without a local push hook.
      - name: Test integrity guard
        run: npm run test:integrity

      # `npm audit` removed: it ran with continue-on-error: true, so it could
      # never fail anything — pure noise on the deploy-gating critical path.
      # Dependency CVEs are the job of Dependabot alerts (which open PRs and
      # page), with Trivy's filesystem scan as a second net. Four overlapping
      # CVE mechanisms on three cadences, only one of which surfaced anywhere,
      # was worse than three.

  test-frontend-unit:
    name: "Frontend Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Same key in both frontend jobs, computed inline from the lockfile so
      # neither job has to wait on a producer job. No `restore-keys:` on
      # purpose — a partial-match tree is unconditionally deleted by the `npm
      # ci` below, so pulling one down is pure download time.
      - name: Restore frontend dependencies
        id: deps-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json') }}

      # The cache save can be rejected by the Actions cache service under load
      # ("rate limit ... unable to reserve cache"), which used to hard-fail this
      # job via fail-on-cache-miss. Fall back to a fresh install instead —
      # slower, but never a spurious red.
      - name: Install frontend dependencies (cache-miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test
        env:
          NODE_ENV: test
          CI: true
