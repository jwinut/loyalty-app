name: Browser E2E

# Full browser end-to-end suite (Playwright `browser` project — *.browser.spec.ts).
#
# This pipeline intentionally does NOT gate deployment. The deploy path
# (ci-build-e2e.yml -> deploy.yml) is gated by the no-browser API
# regression/smoke suite (`regression-api`), which has no cdn.playwright.dev
# dependency. Browser E2E is valuable but its browser provisioning is subject
# to flaky CDN/runner issues, so a red run here must never block shipping.
#
# Browsers come pre-baked in the official Playwright container image, so this
# workflow never downloads them at runtime (no cdn.playwright.dev hop).
#
# Triggers:
#   - workflow_run: after "CI Build & Deploy" finishes on main, against the
#     images that run just pushed to GHCR (tagged with the commit SHA).
#   - workflow_dispatch / schedule: run against the :latest images on demand
#     or nightly.

on:
  workflow_run:
    workflows: ["CI Build & Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR image tag to test (defaults to latest)'
        required: false
        default: 'latest'
  schedule:
    - cron: '17 3 * * *'  # nightly at 03:17 UTC

concurrency:
  group: browser-e2e
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: thehfhotel
  IMAGE_REPO: loyalty-app

jobs:
  browser-e2e:
    name: "Browser E2E"
    runs-on: ubuntu-latest
    # Skip when the upstream build did not succeed (cron / manual runs have no
    # workflow_run context and always proceed).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: loyalty_e2e
          POSTGRES_PASSWORD: loyalty_e2e_pass
          POSTGRES_DB: loyalty_e2e_db
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # The workflow_run trigger is filtered to branches: [main], so head_sha
      # is always an already-merged main commit — never untrusted PR code.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve Playwright image from lockfile
        # Pin the Playwright container to the EXACT @playwright/test version in
        # package-lock.json so the pre-baked browsers always match the test
        # runner. Deriving it here (rather than a hardcoded env) means a
        # Playwright version bump can never silently desync the image again —
        # which is exactly what broke this suite (image v1.59.1 vs runner 1.60.0,
        # "chrome-headless-shell executable doesn't exist").
        #
        # MCR's Docker publish can lag the npm release (1.62.0 shipped on npm
        # with no stable image), and -jammy variants ended at 1.61 — so probe
        # candidates and take the first tag that actually exists. The pinned
        # last resort keeps this NON-GATING suite producing real test signal
        # (possibly against older browsers) instead of docker exit-125; the
        # next run after MCR catches up resolves back to the exact version.
        id: pwimage
        run: |
          VER="$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)"
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "::error::Could not resolve @playwright/test version from package-lock.json"
            exit 1
          fi
          echo "Resolved @playwright/test version: $VER"
          for TAG in "v${VER}-noble" "v${VER}-jammy" "v${VER}" "v1.61.0-noble"; do
            if docker manifest inspect "mcr.microsoft.com/playwright:${TAG}" >/dev/null 2>&1; then
              echo "Using image tag: ${TAG}"
              echo "image=mcr.microsoft.com/playwright:${TAG}" >> "$GITHUB_OUTPUT"
              case "$TAG" in
                *"${VER}"*) echo "exact=true" >> "$GITHUB_OUTPUT" ;;
                *) echo "exact=false" >> "$GITHUB_OUTPUT" ;;
              esac
              exit 0
            fi
            echo "::warning::mcr.microsoft.com/playwright:${TAG} not found, trying next candidate"
          done
          echo "::error::No usable Playwright container image found"
          exit 1

      - name: Resolve image tag
        id: tag
        env:
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -n "${WR_SHA:-}" ]; then
            echo "tag=$WR_SHA" >> "$GITHUB_OUTPUT"
          elif [ -n "${INPUT_TAG:-}" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Shared with ci-build-e2e.yml's regression-api job. Unlike that job,
      # this one can run against `latest` (nightly/manual), so the tag is
      # whatever `Resolve image tag` produced.
      - name: Start app stack
        uses: ./.github/actions/start-app-stack
        with:
          image-tag: ${{ steps.tag.outputs.tag }}

      - name: Run full E2E suite (Playwright container, pre-baked browsers)
        # Run the COMPLETE suite (api + browser projects, including the
        # browser-launching oauth-validation specs) inside the official
        # Playwright image (browsers already installed) on the host network so
        # the tests reach the app on localhost. No cdn.playwright.dev download
        # happens on the exact-match path. When pwimage fell back to an older
        # image (MCR publish lag), the pre-baked browser revisions don't match
        # the @playwright/test runner, so install matching browsers first —
        # a CDN download, but only in the degraded window, and better than 25
        # guaranteed "Executable doesn't exist" failures.
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/work" -w /work \
            -e CI=true \
            -e PW_EXACT_IMAGE='${{ steps.pwimage.outputs.exact }}' \
            -e BACKEND_URL=http://localhost:4202 \
            -e FRONTEND_URL=http://localhost:3201 \
            ${{ steps.pwimage.outputs.image }} \
            bash -lc "npm ci && if [ \"\$PW_EXACT_IMAGE\" != true ]; then npx playwright install --with-deps; fi && npx playwright test"

      - name: Upload Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: browser-e2e-report
          path: |
            playwright-report/
            allure-results/
          retention-days: 7

      - name: Cleanup containers
        if: always()
        run: |
          docker stop backend frontend 2>/dev/null || true
          docker rm backend frontend 2>/dev/null || true

  # =============================================================================
  # NOTIFY ON FAILURE
  #
  # This suite deliberately does NOT gate deploys, which previously meant a red
  # Browser E2E on main paged nobody — it was only visible to whoever opened the
  # Actions tab. That was tolerable while a human approved every production
  # deploy; now that production ships unattended, a real regression caught here
  # needs somewhere to land. Filing/updating a single issue keeps the signal
  # calm (one issue, commented on repeat failures) without blocking shipping.
  # =============================================================================

  notify-on-failure:
    name: "Notify on Browser E2E failure"
    runs-on: ubuntu-latest
    needs: [browser-e2e]
    if: failure() && github.event_name != 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update browser-e2e-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          TITLE="Browser E2E failing on main"
          EXISTING=$(gh issue list -R "${{ github.repository }}" \
            --search "$TITLE in:title is:open" \
            --json number --jq '.[0].number // empty')

          BODY="The non-gating Browser E2E suite failed.

          - Run: $RUN_URL
          - Commit: \`$COMMIT_SHA\`

          This does NOT block deploys by design. Investigate whether it is a real
          regression or browser/CDN flake; see docs/workflow-review-2026-07.md."

          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" -R "${{ github.repository }}" --body "$BODY"
          else
            gh issue create -R "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
