name: Browser E2E

# Full browser end-to-end suite (Playwright `browser` project — *.browser.spec.ts).
#
# This pipeline intentionally does NOT gate deployment. The deploy path
# (ci-build-e2e.yml -> deploy.yml) is gated by the no-browser API
# regression/smoke suite (`regression-api`), which has no cdn.playwright.dev
# dependency. Browser E2E is valuable but its browser provisioning is subject
# to flaky CDN/runner issues, so a red run here must never block shipping.
#
# Browsers come pre-baked in the official Playwright container image, so this
# workflow never downloads them at runtime (no cdn.playwright.dev hop).
#
# Triggers:
#   - workflow_run: after "CI Build & Deploy" finishes on main, against the
#     images that run just pushed to GHCR (tagged with the commit SHA).
#   - workflow_dispatch / schedule: run against the :latest images on demand
#     or nightly.

on:
  workflow_run:
    workflows: ["CI Build & Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR image tag to test (defaults to latest)'
        required: false
        default: 'latest'
  schedule:
    - cron: '17 3 * * *'  # nightly at 03:17 UTC

concurrency:
  group: browser-e2e
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: thehfhotel
  IMAGE_REPO: loyalty-app
  # Must match the @playwright/test version in package-lock.json so the
  # pre-baked browsers match the test runner.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.59.1-jammy

jobs:
  browser-e2e:
    name: "Browser E2E"
    runs-on: ubuntu-latest
    # Skip when the upstream build did not succeed (cron / manual runs have no
    # workflow_run context and always proceed).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: loyalty_e2e
          POSTGRES_PASSWORD: loyalty_e2e_pass
          POSTGRES_DB: loyalty_e2e_db
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: tag
        env:
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -n "${WR_SHA:-}" ]; then
            echo "tag=$WR_SHA" >> "$GITHUB_OUTPUT"
          elif [ -n "${INPUT_TAG:-}" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull application images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}/backend:${TAG}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}/frontend:${TAG}

      - name: Start backend container
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker run -d --name backend --network host \
            -e RUST_ENV=development \
            -e NODE_ENV=development \
            -e PORT=4202 \
            -e DATABASE_URL=postgresql://loyalty_e2e:loyalty_e2e_pass@localhost:5436/loyalty_e2e_db \
            -e REDIS_URL=redis://localhost:6381 \
            -e JWT_SECRET=e2e-jwt-secret-for-testing-minimum-64-characters-long-secure-token-string \
            -e JWT_REFRESH_SECRET=e2e-jwt-refresh-secret-for-testing-minimum-64-characters-long-string \
            -e SESSION_SECRET=e2e-session-secret-for-testing-minimum-64-characters-long-secure-string \
            -e GOOGLE_CLIENT_ID=e2e-google-client-id \
            -e GOOGLE_CLIENT_SECRET=e2e-google-client-secret \
            -e GOOGLE_CALLBACK_URL=http://localhost:4202/api/oauth/google/callback \
            -e LINE_CLIENT_ID=e2e-line-channel-id \
            -e LINE_CLIENT_SECRET=e2e-line-channel-secret \
            -e LINE_CALLBACK_URL=http://localhost:4202/api/oauth/line/callback \
            -e FRONTEND_URL=http://localhost:3201 \
            -e RUST_LOG=info \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}/backend:${TAG}

      - name: Start frontend container
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker run -d --name frontend \
            --add-host=host.docker.internal:host-gateway \
            -v ${{ github.workspace }}/frontend/nginx.e2e.conf:/etc/nginx/nginx.conf:ro \
            -p 3201:80 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}/frontend:${TAG}

      - name: Wait for services
        run: |
          echo "Waiting for backend..."
          for i in {1..30}; do
            if curl -sf http://localhost:4202/api/health > /dev/null 2>&1; then
              echo "Backend is ready"; break
            fi
            if [ $i -eq 30 ]; then echo "Backend failed to start"; docker logs backend; exit 1; fi
            sleep 2
          done

          echo "Waiting for frontend..."
          for i in {1..30}; do
            if curl -sf http://localhost:3201 > /dev/null 2>&1; then
              echo "Frontend is ready"; break
            fi
            if [ $i -eq 30 ]; then echo "Frontend failed to start"; docker logs frontend; exit 1; fi
            sleep 2
          done

      - name: Seed E2E test users
        run: |
          curl -sf -X POST http://localhost:4202/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"e2e-browser@test.com","password":"E2ETestPassword123!","firstName":"E2E","lastName":"Browser"}' \
            && echo "Created e2e-browser@test.com" || echo "User may already exist"
          curl -sf -X POST http://localhost:4202/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"e2e-browser-2@test.com","password":"E2ETestPassword123!","firstName":"E2E","lastName":"Browser2"}' \
            && echo "Created e2e-browser-2@test.com" || echo "User may already exist"
          curl -sf -X POST http://localhost:4202/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"e2e-admin@test.local","password":"AdminPassword123!","firstName":"E2E","lastName":"Admin"}' \
            && echo "Created e2e-admin@test.local" || echo "User may already exist"
          echo "E2E test users seeded"

      - name: Run full E2E suite (Playwright container, pre-baked browsers)
        # Run the COMPLETE suite (api + browser projects, including the
        # browser-launching oauth-validation specs) inside the official
        # Playwright image (browsers already installed) on the host network so
        # the tests reach the app on localhost. No cdn.playwright.dev download
        # happens at any point. This is the comprehensive, non-blocking check.
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/work" -w /work \
            -e CI=true \
            -e BACKEND_URL=http://localhost:4202 \
            -e FRONTEND_URL=http://localhost:3201 \
            ${{ env.PLAYWRIGHT_IMAGE }} \
            bash -lc "npm ci && npx playwright test"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-e2e-report
          path: |
            playwright-report/
            allure-results/
          retention-days: 7

      - name: Cleanup containers
        if: always()
        run: |
          docker stop backend frontend 2>/dev/null || true
          docker rm backend frontend 2>/dev/null || true
