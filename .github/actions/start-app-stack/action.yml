name: "Start app stack (GHCR images)"
description: >-
  Pull the backend/frontend images for a given tag, start them against the
  caller's postgres/redis service containers, wait for both to answer, and seed
  the standard E2E users. Extracted from ci-build-e2e.yml (regression-api) and
  e2e.yml (browser-e2e), which carried ~70 lines of this verbatim each and had
  already drifted apart in formatting.

  The caller still owns: the postgres/redis `services:` block, GHCR login, and
  whatever test runner it invokes afterwards.

inputs:
  image-tag:
    description: "GHCR tag to pull (a commit SHA, or 'latest' for scheduled runs)."
    required: true
  registry:
    description: "Container registry host."
    required: false
    default: ghcr.io
  image-owner:
    description: "Registry namespace/owner."
    required: false
    default: thehfhotel
  image-repo:
    description: "Image repository name."
    required: false
    default: loyalty-app
  backend-port:
    description: "Host port the backend listens on."
    required: false
    default: "4202"
  frontend-port:
    description: "Host port the frontend nginx listens on."
    required: false
    default: "3201"
  postgres-port:
    description: "Host port of the caller's postgres service container."
    required: false
    default: "5436"
  redis-port:
    description: "Host port of the caller's redis service container."
    required: false
    default: "6381"

runs:
  using: composite
  steps:
    - name: Pull application images
      shell: bash
      env:
        IMAGE_BASE: ${{ inputs.registry }}/${{ inputs.image-owner }}/${{ inputs.image-repo }}
        TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        docker pull "${IMAGE_BASE}/backend:${TAG}"
        docker pull "${IMAGE_BASE}/frontend:${TAG}"

    - name: Start backend container
      shell: bash
      env:
        IMAGE_BASE: ${{ inputs.registry }}/${{ inputs.image-owner }}/${{ inputs.image-repo }}
        TAG: ${{ inputs.image-tag }}
        BACKEND_PORT: ${{ inputs.backend-port }}
        FRONTEND_PORT: ${{ inputs.frontend-port }}
        PG_PORT: ${{ inputs.postgres-port }}
        REDIS_PORT: ${{ inputs.redis-port }}
      run: |
        set -euo pipefail
        docker run -d --name backend --network host \
          -e RUST_ENV=development \
          -e NODE_ENV=development \
          -e PORT="${BACKEND_PORT}" \
          -e DATABASE_URL="postgresql://loyalty_e2e:loyalty_e2e_pass@localhost:${PG_PORT}/loyalty_e2e_db" \
          -e REDIS_URL="redis://localhost:${REDIS_PORT}" \
          -e JWT_SECRET=e2e-jwt-secret-for-testing-minimum-64-characters-long-secure-token-string \
          -e JWT_REFRESH_SECRET=e2e-jwt-refresh-secret-for-testing-minimum-64-characters-long-string \
          -e SESSION_SECRET=e2e-session-secret-for-testing-minimum-64-characters-long-secure-string \
          -e GOOGLE_CLIENT_ID=e2e-google-client-id \
          -e GOOGLE_CLIENT_SECRET=e2e-google-client-secret \
          -e GOOGLE_CALLBACK_URL="http://localhost:${BACKEND_PORT}/api/oauth/google/callback" \
          -e LINE_CLIENT_ID=e2e-line-channel-id \
          -e LINE_CLIENT_SECRET=e2e-line-channel-secret \
          -e LINE_CALLBACK_URL="http://localhost:${BACKEND_PORT}/api/oauth/line/callback" \
          -e FRONTEND_URL="http://localhost:${FRONTEND_PORT}" \
          -e RUST_LOG=info \
          "${IMAGE_BASE}/backend:${TAG}"

    - name: Start frontend container
      shell: bash
      env:
        IMAGE_BASE: ${{ inputs.registry }}/${{ inputs.image-owner }}/${{ inputs.image-repo }}
        TAG: ${{ inputs.image-tag }}
        FRONTEND_PORT: ${{ inputs.frontend-port }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        docker run -d --name frontend \
          --add-host=host.docker.internal:host-gateway \
          -v "${WORKSPACE}/frontend/nginx.e2e.conf:/etc/nginx/nginx.conf:ro" \
          -p "${FRONTEND_PORT}:80" \
          "${IMAGE_BASE}/frontend:${TAG}"

    - name: Wait for services
      shell: bash
      env:
        BACKEND_PORT: ${{ inputs.backend-port }}
        FRONTEND_PORT: ${{ inputs.frontend-port }}
      run: |
        set -euo pipefail
        for i in $(seq 1 30); do
          if curl -sf "http://localhost:${BACKEND_PORT}/api/health" >/dev/null 2>&1; then
            echo "Backend is ready"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "::error::Backend failed to start"
            docker logs backend
            exit 1
          fi
          sleep 2
        done

        for i in $(seq 1 30); do
          if curl -sf "http://localhost:${FRONTEND_PORT}" >/dev/null 2>&1; then
            echo "Frontend is ready"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "::error::Frontend failed to start"
            docker logs frontend
            exit 1
          fi
          sleep 2
        done

    - name: Seed E2E test users
      shell: bash
      env:
        BACKEND_PORT: ${{ inputs.backend-port }}
      run: |
        set -euo pipefail
        echo "Creating E2E test users..."
        # Registration is idempotent from this script's point of view: a 4xx
        # because the user already exists is fine, so failures are tolerated
        # per-user rather than failing the job.
        seed() {
          local email="$1" password="$2" first="$3" last="$4"
          if curl -sf -X POST "http://localhost:${BACKEND_PORT}/api/auth/register" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"${email}\",\"password\":\"${password}\",\"firstName\":\"${first}\",\"lastName\":\"${last}\"}" \
              >/dev/null; then
            echo "Created ${email}"
          else
            echo "${email} may already exist"
          fi
        }

        # Passwords are NOT uniform — the two guest users and the admin differ,
        # and the specs authenticate with these exact values.
        seed "e2e-browser@test.com"   "E2ETestPassword123!" "E2E" "Browser"
        seed "e2e-browser-2@test.com" "E2ETestPassword123!" "E2E" "Browser2"
        # Admin email must stay in sync with admins.e2e.json.
        seed "e2e-admin@test.local"   "AdminPassword123!"   "E2E" "Admin"
        echo "E2E test users seeded"
